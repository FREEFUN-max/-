name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      npm_config_arch: x64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Set version
        run: npm version "2.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Compile
        run: npm run compile

      - name: Build
        run: npx electron-builder --win --publish never

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" \
            dist/*.exe \
            dist/*.yml \
            dist/*.blockmap \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ekoloko v2.0.${{ github.run_number }}" \
            --notes "Automated release from commit ${{ github.sha }}." \
            --latest